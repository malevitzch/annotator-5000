[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "annotator-5000"
version = "0.1.0"
description = "A small web application for coordinating image annotation"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "Flask>=3.0,<4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]
namespaces = true

[tool.setuptools.package-data]
app = ["templates/*.html"]
