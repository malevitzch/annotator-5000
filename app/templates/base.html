<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Image annotator{% endblock %}</title>
  <style>
    :root { color-scheme: light dark; font-family: system-ui, sans-serif; }
    body { max-width: 900px; margin: 2rem auto; padding: 0 1rem; }
    header { display: flex; justify-content: space-between; align-items: center; gap: 1rem; }
    .messages { padding: 0; list-style: none; }
    .messages li { margin: 0.5rem 0; padding: 0.75rem; border-radius: 0.25rem; }
    .messages .error { background: #8b2e2e; color: white; }
    .messages .success { background: #28633d; color: white; }
    button, input { font: inherit; }
    button { padding: 0.55rem 1rem; cursor: pointer; }
    .muted { opacity: 0.75; }
    .progress-section { margin: 1rem 0 1.5rem; }
    .progress-heading { display: flex; justify-content: space-between; gap: 1rem; margin-bottom: 0.4rem; }
    .progress-bar { display: block; width: 100%; height: 1rem; accent-color: #4a9b68; }
    body.label-page { margin-top: 0; }
    body.label-page h1 { margin-top: 0; }
  </style>
</head>
<body class="{% block body_class %}{% endblock %}">
  {% with messages = get_flashed_messages(with_categories=true) %}
    {% if messages %}
      <ul class="messages">
        {% for category, message in messages %}<li class="{{ category }}">{{ message }}</li>{% endfor %}
      </ul>
    {% endif %}
  {% endwith %}
  {% block body %}{% endblock %}
</body>
</html>
