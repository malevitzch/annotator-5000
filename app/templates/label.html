{% extends "base.html" %}
{% block title %}Label image{% endblock %}
{% block body %}
  <header>
    <h1>Label image</h1>
    <div>
      <span class="muted">Signed in as {{ username }}</span>
      <form action="{{ url_for('logout') }}" method="post" style="display:inline">
        <button type="submit">Switch user</button>
      </form>
    </div>
  </header>

  <p>Check every issue that applies, then submit to get another image.</p>
  <figure style="margin: 1rem 0">
    <img
      src="{{ url_for('image_file', image_set=image[0], image_id=image[1]) }}"
      alt="Image to annotate"
      style="display:block; max-width:100%; max-height:70vh; object-fit:contain"
    >
    <figcaption class="muted">{{ image[0] }} / {{ image[1] }}</figcaption>
  </figure>

  <form action="{{ url_for('submit_label') }}" method="post">
    {% for name, description in labels %}
      <div style="margin:0.75rem 0">
        <label>
          <input type="checkbox" name="{{ name }}" value="1">
          {{ description }}
        </label>
      </div>
    {% endfor %}
    <button type="submit">Submit and continue</button>
  </form>
{% endblock %}
